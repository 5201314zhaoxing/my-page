<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜灯信箱 · 匿名投递</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☾</text></svg>">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --gold: #e8c87a;
    --gold-bright: #ffe9a8;
    --gold-deep: #c9983a;
    --gold-dim: rgba(232,200,122,0.3);
    --gold-glow: rgba(232,200,122,0.5);
    --deep: #081026;
    --text: #f0ece0;
    --text-dim: rgba(240,236,224,0.72);
  }
  html, body { height: 100%; }
  body {
    font-family: 'Noto Serif SC', 'Cormorant Garamond', serif;
    color: var(--text);
    background: linear-gradient(180deg, #0a122e 0%, #0d1b3d 50%, #081026 100%);
    line-height: 1.8;
    overflow-x: hidden;
  }

  .stars-bg {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    overflow: hidden;
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  .container {
    position: relative; z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 60px 30px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .eyebrow {
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.5em; font-size: 0.82rem;
    color: var(--gold); text-transform: uppercase;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 16px;
    justify-content: center;
  }
  .eyebrow::before, .eyebrow::after {
    content: ''; width: 30px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim));
  }
  .eyebrow::after {
    background: linear-gradient(90deg, var(--gold-dim), transparent);
  }

  h1 {
    font-size: clamp(2rem, 5vw, 2.8rem);
    font-weight: 700; color: #fff;
    text-align: center; margin-bottom: 15px;
    letter-spacing: 0.08em;
    text-shadow: 0 0 40px rgba(232,200,122,0.3);
  }

  .subtitle {
    text-align: center;
    color: var(--text-dim);
    font-weight: 300;
    font-size: 1rem;
    margin-bottom: 40px;
    letter-spacing: 0.05em;
  }

  .mailbox-icon {
    width: 70px; height: 70px;
    margin: 0 auto 30px;
    border: 1px solid var(--gold-dim);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; color: var(--gold);
    background: rgba(232,200,122,0.06);
    box-shadow: 0 0 30px rgba(232,200,122,0.15);
  }

  textarea {
    width: 100%;
    min-height: 200px;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 25px;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
    line-height: 1.8;
    resize: vertical;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(10px);
  }
  textarea::placeholder {
    color: rgba(240,236,224,0.35);
  }
  textarea:focus {
    border-color: var(--gold);
    box-shadow: 0 0 30px rgba(232,200,122,0.15);
  }

  .char-count {
    text-align: right;
    font-size: 0.8rem;
    color: var(--gold-dim);
    margin-top: 8px;
    font-family: 'Cormorant Garamond', serif;
  }

  .btn-group {
    margin-top: 30px;
    display: flex;
    gap: 15px;
    justify-content: center;
  }

  .btn {
    padding: 14px 40px;
    border: 1px solid var(--gold);
    background: transparent;
    color: var(--gold-bright);
    font-family: inherit;
    letter-spacing: 0.2em;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.4s ease;
  }
  .btn:hover {
    background: var(--gold);
    color: var(--deep);
    box-shadow: 0 0 40px var(--gold-glow);
    transform: translateY(-2px);
  }
  .btn-secondary {
    border-color: var(--gold-dim);
    color: var(--gold-dim);
  }
  .btn-secondary:hover {
    border-color: var(--gold);
    color: var(--gold);
    background: rgba(232,200,122,0.08);
    box-shadow: 0 0 20px rgba(232,200,122,0.15);
  }

  .privacy-note {
    margin-top: 35px;
    text-align: center;
    font-size: 0.85rem;
    color: var(--text-dim);
    font-weight: 300;
  }
  .privacy-note strong {
    color: var(--gold);
    font-weight: 400;
  }

  .success-msg {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-msg.show { display: block; }
  .success-msg .big {
    font-size: 3rem;
    margin-bottom: 20px;
  }
  .success-msg h2 {
    font-size: 1.5rem;
    color: var(--gold-bright);
    margin-bottom: 15px;
  }
  .success-msg p {
    color: var(--text-dim);
    font-weight: 300;
  }
  .success-msg .tip {
    margin-top: 15px;
    font-size: 0.85rem;
    color: var(--gold-dim);
  }

  @media (max-width: 600px) {
    .container { padding: 40px 20px; }
    .btn-group { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<div class="stars-bg" id="starsBg"></div>

<div class="container">
  <div id="formView">
    <div class="eyebrow">Anonymous Mailbox</div>
    <div class="mailbox-icon">☾</div>
    <h1>夜灯信箱</h1>
    <p class="subtitle">写下你想说的话，没有人知道是谁。<br>我会认真读每一条，温柔回应。</p>

    <textarea id="msgInput" placeholder="在这里写下你的心情、烦恼、或者只是想说说话……&#10;&#10;可以是开心的事，也可以是难过的事，不用客气，我都在。" maxlength="1000"></textarea>
    <div class="char-count"><span id="charNum">0</span> / 1000</div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="clearMsg()">清空</button>
      <button class="btn" onclick="submitMsg()">投递</button>
    </div>

    <p class="privacy-note">
      点击投递会自动打开邮件 · 点发送就好 · <strong>请放心说</strong>
    </p>
  </div>

  <div class="success-msg" id="successView">
    <div class="big">✦</div>
    <h2>即将打开邮件发送</h2>
    <p>你的消息会通过邮件发送，<br>收件人已经填好，点发送就好。</p>
    <p class="tip">如果没自动打开，请检查浏览器是否拦截了弹窗~</p>
    <br>
    <button class="btn" onclick="resetForm()" style="margin-top:20px;">再写一条</button>
  </div>
</div>

<script>
// 在这里改成你自己的邮箱！！！
const MY_EMAIL = '550089917@qq.com';

// 生成星星背景
const starsBg = document.getElementById('starsBg');
for(let i=0;i<80;i++){
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random()*2+1;
  s.style.width = size+'px';
  s.style.height = size+'px';
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.animationDelay = Math.random()*3+'s';
  s.style.animationDuration = (Math.random()*2+2)+'s';
  starsBg.appendChild(s);
}

// 字数统计
const input = document.getElementById('msgInput');
const charNum = document.getElementById('charNum');
input.addEventListener('input', () => {
  charNum.textContent = input.value.length;
});

function clearMsg() {
  input.value = '';
  charNum.textContent = '0';
}

function submitMsg() {
  const msg = input.value.trim();
  if(!msg) {
    alert('先写点什么再投递吧~');
    return;
  }
  // 构造邮件
  const subject = encodeURIComponent('【夜灯信箱】一封匿名来信');
  const body = encodeURIComponent(msg);
  const mailtoLink = `mailto:${MY_EMAIL}?subject=${subject}&body=${body}`;
  
  // 打开邮件客户端
  window.location.href = mailtoLink;
  
  // 显示成功页
  document.getElementById('formView').style.display = 'none';
  document.getElementById('successView').classList.add('show');
}

function resetForm() {
  clearMsg();
  document.getElementById('successView').classList.remove('show');
  document.getElementById('formView').style.display = 'block';
}
</script>

</body>
</html>
